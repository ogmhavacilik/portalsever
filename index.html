<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritabanı Portalı</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="view-container"></div>

    <script>
        // Adresin kaynak kodda ve düz metin olarak görünmesini engellemek için parçalı ve şifreli tanım:
        // "https://veritabani-portali.ai.studio/"
        const p1 = "aHR0cHM6Ly92ZXJpdGFi";
        const p2 = "YW5pLXBvcnRhbGkuYWk";
        const p3 = "uc3R1ZGlvLw==";
        
        // Parçaları birleştirip Base64 formatından metne dönüştürme
        const targetUrl = atob(p1 + p2 + p3);

        // Dinamik olarak iframe oluşturma
        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.setAttribute('allowfullscreen', 'true');

        document.getElementById('view-container').appendChild(iframe);

        // Güvenli yükleme
        try {
            iframe.contentWindow.location.replace(targetUrl);
        } catch (e) {
            iframe.src = targetUrl;
        }
    </script>

</body>
</html>
